name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Assets & Build Android
        run: |
          npm install
          npm install @capacitor/assets @capacitor/splash-screen@6
          npx cap add android
          mkdir -p assets
          LOGO_FILE=$(find . -maxdepth 3 -iname "*logo*.png" -o -iname "*khidmatun*.png" | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            echo "Found logo: $LOGO_FILE"
            cp "$LOGO_FILE" assets/icon-only.png
            cp "$LOGO_FILE" assets/icon-foreground.png
            cp "$LOGO_FILE" assets/splash.png
            python3 -c "from PIL import Image; Image.new('RGBA', (1024, 1024), (255, 255, 255, 255)).save('assets/icon-background.png')" || cp "$LOGO_FILE" assets/icon-background.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          else
            echo "Logo image not found in repository!"
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khidmatun-nas-buyer
          path: android/app/build/outputs/apk/debug/app-debug.apk
